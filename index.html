<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoops Type</title>
  </head>
  <body>
    <div id="stage">
      <canvas id="court" aria-hidden="true"></canvas>
      <section id="strip" aria-label="Drill">
        <p class="strip-line strip-target" id="strip-target"></p>
        <p class="strip-line strip-typed" id="strip-typed"></p>
        <p class="strip-hint" id="strip-hint"></p>
      </section>
      <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
        <div class="modal-card">
          <h2 class="modal-title" id="modal-title"></h2>
          <div class="modal-body" id="modal-body"></div>
          <p class="modal-footer">Strike <kbd>Enter</kbd> to continue.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
